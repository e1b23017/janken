<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <title>Wait</title>
</head>

<body>
  <a href="/logout">ログアウト</a>
  <h1>Wait</h1>

  <p>相手の手を待ってます</p>

  <div id="kekkaArea" style="display:none;">
    <p id="kekkaText"></p>
    <p><a id="backLink" href="/janken">戻る</a></p>
  </div>

  <script>
    const POLL_INTERVAL = 1000;
    let polling = true;

    async function poll() {
      try {
        const resp = await fetch('/async-kekka', { credentials: 'same-origin' });
        if (!resp.ok) {
          console.error('async-kekka error:', resp.status);
          return;
        }
        const data = await resp.json();
        if (data.found) {
          const userHand = data.userHand || '-';
          const opponentHand = data.opponentHand || '-';
          const result = data.result || '-';
          const text = `あなたの手: ${userHand}　相手の手: ${opponentHand}　結果: ${result}`;
          document.getElementById('kekkaText').textContent = text;
          document.getElementById('kekkaArea').style.display = 'block';
          polling = false;
        }
      } catch (e) {
        console.error('poll error', e);
      }
    }

    (function startPolling() {
      poll();
      const timer = setInterval(() => {
        if (!polling) {
          clearInterval(timer);
          return;
        }
        poll();
      }, POLL_INTERVAL);
    })();
  </script>

  <p><a href="/janken">もどる</a></p>
</body>

</html>
